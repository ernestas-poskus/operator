name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@nextest
      # lance's build scripts generate protobuf bindings with protoc, and
      # lancedb does not enable lance's vendored-protoc feature.
      - name: Install protoc
        env:
          HOMEBREW_NO_AUTO_UPDATE: 1
        run: brew install protobuf
      - name: Format
        run: cargo fmt -p code-intelligence -- --check
      - name: Check
        run: cargo check --locked
      - name: Check without TUI
        run: cargo check --locked --no-default-features --all-targets
      - name: Test
        run: cargo nextest run --status-level fail -p code-intelligence
      - name: Test without TUI
        run: cargo nextest run --no-default-features -p code-intelligence --status-level fail
      - name: Clippy
        run: cargo clippy --all-targets
      - name: Docs
        run: cargo doc --no-deps
