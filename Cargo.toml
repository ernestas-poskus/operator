[package]
name = "operator"
version = "0.1.0"
edition = "2024"
description = "Read-only code-intelligence library and MCP server for coding agents, built on ast-grep, LanceDB, and full-text search."
authors = ["Ernestas Poskus"]
license = "MIT"
repository = "https://github.com/ernestas-poskus/operator"
homepage = "https://github.com/ernestas-poskus/operator"
readme = "README.md"
keywords = ["agent", "coding-agent", "mcp", "ast-grep", "code-search"]
categories = ["command-line-utilities", "development-tools"]
rust-version = "1.95"
# The crates.io name `operator` belongs to an unrelated crate; this project is
# installed from source (`cargo install --path .`), not published.
publish = false

# The installed binary is `operator` (docs and AGENTS.md reference
# ~/.cargo/bin/operator).
[lib]
name = "operator"
path = "src/lib.rs"

[[bin]]
name = "operator"
path = "src/main.rs"

[features]
default = ["tui"]
tui = ["dep:crossterm", "dep:notify", "dep:ratatui"]

[build-dependencies]
serde_json = "1"

[dependencies]
argh = "0.1"
ast-grep-core = { version = "0.51.1", default-features = false, features = [
  "tree-sitter",
] }
ast-grep-language = { version = "0.51.1", features = ["builtin-parser"] }
ast-grep-config = "0.51.1"
ast-grep-outline = "0.51.1"
async-trait = "0.1"
anydoc = "=0.2.4"
arrow-array = "58"
arrow-schema = "58"
crate-map = { path = "crates/crate-map" }
crossterm = { version = "0.29", optional = true }
notify = { version = "8", optional = true }
ratatui = { version = "0.30", optional = true }
futures = { version = "0.3", default-features = false, features = ["std"] }
glob = "0.3"
ignore = "0.4"
lancedb = { version = "0.41", default-features = false }
regex = "1"
rmcp = { version = "3.7", default-features = false, features = [
  "macros",
  "server",
  "transport-io",
] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = { version = "0.11", default-features = false, features = ["alloc"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }
toml = "1.1"
toml_edit = "0.25"
xberg = { version = "1.3", default-features = false, features = ["chunking"] }
demand = "2.4"

[dev-dependencies]
tempfile = "3"

[profile.dev.package."*"]
debug = "line-tables-only"

[profile.dev.build-override]
debug = false

# Retrieval runs in-process on the GPU through fastembed's candle backend:
# Metal on macOS, CUDA on Linux and Windows (the CUDA toolkit is required at
# build time there). GPU is required; there is no CPU fallback.
[target.'cfg(target_os = "macos")'.dependencies]
candle-core = "0.11.1"
fastembed = { version = "7.7", default-features = false, features = [
  "metal",
  "hf-hub-rustls-tls",
] }

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
candle-core = "0.11.1"
fastembed = { version = "7.7", default-features = false, features = [
  "cuda",
  "bert-text",
  "hf-hub-rustls-tls",
] }
